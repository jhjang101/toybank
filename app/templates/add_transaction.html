<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Teller Portal</title>
<!-- Always load the common styles first -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!-- Then load the specific styles for forms, which can override global styles if needed -->
<link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">

</head>
<body>

<div class="container">
    <header class="header">
        <h1>Bank Teller Portal</h1>
    </header>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="date">Date*</label>
            <!-- Sets the default date to today, passed from Flask -->
            <input type="date" id="date" name="date" value="{{ today }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description*</label>
            <textarea id="description" name="description" rows="2" placeholder="e.g., Allowance, Bought new toy, Yard work bonus" required></textarea>
        </div>
        
        <div class="form-group">
            <label for="deposit">Deposit Amount</label>
            <input type="number" id="deposit" name="deposit" step="0.01" min="0" placeholder="e.g., 5.00">
        </div>
        
        <div class="form-group">
            <label for="withdrawal">Withdrawal Amount</label>
            <input type="number" id="withdrawal" name="withdrawal" step="0.01" min="0" placeholder="e.g., 2.50">
        </div>

        <button type="submit" class="form-submit-button">Record Transaction</button>
    </form>

    <a href="{{ url_for('ledger_view') }}" class="back-link">← Back to Ledger</a>
</div>

</body>
</html>
