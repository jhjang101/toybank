<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teller Login</title>
<!-- Always load the common styles first -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!-- Then load the specific styles for forms, which can override global styles if needed -->
<link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">

</head>
<body>

<div class="container">
    <header class="header">
        <h2>Bank Teller Login</h2>
        <p>Enter the master password to access the transaction portal.</p>
    </header>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="form-submit-button">Login</button>
    </form>

</div>

</body>
</html>
