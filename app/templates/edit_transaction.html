<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction (ID: {{ transaction.id }})</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
</head>
<body>

    <div class="container">
        <header class="header">
            <h2>Edit Transaction (ID: {{ transaction.id }})</h2>
        </header>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST">
            
            <input type="hidden" name="id" value="{{ transaction.id }}">

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ transaction.date }}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="2" required>{{ transaction.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="deposit">Deposit Amount (Optional)</label>
                <input type="number" id="deposit" name="deposit" step="0.01" min="0" 
                       value="{{ '%.2f' | format(transaction.deposit) }}" placeholder="e.g., 5.00">
            </div>
            
            <div class="form-group">
                <label for="withdrawal">Withdrawal Amount (Optional)</label>
                <input type="number" id="withdrawal" name="withdrawal" step="0.01" min="0" 
                       value="{{ '%.2f' | format(transaction.withdrawal) }}" placeholder="e.g., 2.50">
            </div>

            <button type="submit" class="form-submit-button">Update Transaction</button>
        </form>

        <a href="{{ url_for('ledger_view') }}" class="back-link">← Cancel and Back to Ledger</a>
    </div>

</body>
</html>
